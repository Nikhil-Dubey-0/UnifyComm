[project]
name = "unifycomm-backend"
version = "0.1.0"
description = "UnifyComm API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.12",
    "phonenumbers>=8.13",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "openai>=1.60",
    # Worker-only AI stack (never imported by the api process; see ARCHITECTURE D3)
    "torch>=2.14",
    "transformers>=5.0,<6",
    "safetensors>=0.4",
    "huggingface-hub>=0.26",
    "truststore>=0.10.4",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false
# This machine's network re-signs TLS traffic; trust the Windows certificate store.
native-tls = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["models: golden tests that need real model weights"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep SQL literals on one line.
"migrations/versions/*" = ["E501"]
