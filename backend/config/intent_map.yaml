# Intent label → routing category (ARCHITECTURE §7.3).
# Every one of the 213 labels in models/intent/repro-v1/id2label.json appears exactly once.
# tests/unit/test_intent_map.py enforces this contract.
#
# Category flags:
#   queue:       name shown in the agent UI (null = no queue)
#   substantive: false means messages in this category never set or change a
#                conversation's category or primary intent (§7.4)
#   default_priority: priority before the sentiment raise (§7.5)

categories:
  fraud_security:
    queue: Fraud & Security
    substantive: true
    default_priority: urgent
  payments_billing:
    queue: Payments & Billing
    substantive: true
    default_priority: normal
  transfers_topups:
    queue: Transfers & Top-ups
    substantive: true
    default_priority: normal
  cards:
    queue: Cards
    substantive: true
    default_priority: normal
  account_access:
    queue: Account & Identity
    substantive: true
    default_priority: normal
  loans_credit:
    queue: Loans & Credit
    substantive: true
    default_priority: normal
  general_banking:
    queue: General
    substantive: true
    default_priority: low
  small_talk:
    queue: null
    substantive: false
    default_priority: low
  out_of_scope:
    queue: Other
    substantive: false
    default_priority: low

